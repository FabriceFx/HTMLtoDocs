<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
      :root {
        --md-sys-color-primary: #0061a4;
        --md-sys-color-on-primary: #ffffff;
        --md-sys-color-primary-container: #d1e4ff;
        --md-sys-color-on-primary-container: #001d36;
        --md-sys-color-secondary: #535f70;
        --md-sys-color-on-secondary: #ffffff;
        --md-sys-color-surface: #fdfcff;
        --md-sys-color-on-surface: #1a1c1e;
        --md-sys-color-surface-variant: #dfe2eb;
        --md-sys-color-on-surface-variant: #43474e;
        --md-sys-color-outline: #73777f;
        --md-sys-color-error: #ba1a1a;
        --md-sys-color-success: #137333;
      }

      body {
        font-family: 'Roboto', sans-serif;
        padding: 12px;
        margin: 0;
        background-color: #f8f9fa;
        color: var(--md-sys-color-on-surface);
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        border: 1px solid var(--md-sys-color-surface-variant);
        box-sizing: border-box;
      }

      h2 {
        font-size: 1rem;
        font-weight: 500;
        margin: 0 0 12px 0;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--md-sys-color-primary);
      }

      .input-group {
        margin-bottom: 12px;
      }

      label {
        display: block;
        font-size: 0.75rem;
        font-weight: 500;
        margin-bottom: 4px;
        color: var(--md-sys-color-on-surface-variant);
      }

      input[type="password"],
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--md-sys-color-outline);
        border-radius: 8px;
        font-size: 13px;
        box-sizing: border-box;
        transition: border 0.2s;
        background-color: transparent;
      }

      input:focus, textarea:focus {
        outline: none;
        border: 2px solid var(--md-sys-color-primary);
      }

      textarea {
        font-family: 'Roboto Mono', monospace;
        resize: vertical;
        min-height: 60px;
      }

      .btn-container {
        width: 100%;
        margin-top: 8px;
      }

      button {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        width: 100%;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 500;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
        box-sizing: border-box;
        text-align: center;
        line-height: 1.2;
      }

      .btn-primary {
        background-color: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
      }

      .btn-tonal {
        background-color: var(--md-sys-color-primary-container);
        color: var(--md-sys-color-on-primary-container);
      }

      button:disabled {
        background-color: #e1e2e5;
        color: #909194;
        cursor: not-allowed;
      }

      .material-icons {
        font-size: 18px;
        flex-shrink: 0;
      }

      #status {
        margin-top: 8px;
        font-size: 12px;
        padding: 10px;
        border-radius: 8px;
        display: none;
      }

      .success { background-color: #e6f4ea; color: var(--md-sys-color-success); display: flex !important; align-items: center; gap: 6px; }
      .error { background-color: #fce8e6; color: var(--md-sys-color-error); display: flex !important; align-items: center; gap: 6px; }

      .loader {
        display: none;
        margin-top: 8px;
        text-align: center;
        font-size: 12px;
        color: var(--md-sys-color-secondary);
      }
    </style>
  </head>
  <body>

    <div class="card">
      <h2><span class="material-icons">auto_awesome</span> Génération IA</h2>
      <div class="input-group">
        <label for="apiKey">Clé API Gemini</label>
        <input type="password" id="apiKey" placeholder="Votre clé API...">
      </div>
      <div class="input-group">
        <label for="prompt">Votre demande</label>
        <textarea id="prompt" placeholder="Ex: Newsletter soldes d'été..."></textarea>
      </div>
      <div class="btn-container">
        <button id="genBtn" class="btn-tonal" onclick="generateWithGemini()">
          <span class="material-icons">magic_button</span> Générer le HTML
        </button>
      </div>
    </div>

    <div class="card">
      <h2><span class="material-icons">code</span> Code HTML</h2>
      <div class="input-group">
        <textarea id="htmlInput" style="height: 120px;" placeholder="<html>...</html>"></textarea>
      </div>
      <div class="btn-container">
        <button id="insertBtn" class="btn-primary" onclick="insertHtml()">
          <span class="material-icons">send</span> Insérer dans le Doc
        </button>
      </div>
      
      <div id="loader" class="loader">Traitement en cours...</div>
      <div id="status"></div>
    </div>

    <script>
      window.onload = function() {
        google.script.run
          .withSuccessHandler(function(key) {
            if (key) document.getElementById('apiKey').value = key;
          })
          .getSavedApiKey();
      };

      function generateWithGemini() {
        const apiKey = document.getElementById('apiKey').value;
        const prompt = document.getElementById('prompt').value;
        const genBtn = document.getElementById('genBtn');
        const loader = document.getElementById('loader');
        const status = document.getElementById('status');
        
        if (!apiKey || !prompt) {
          showStatus("Clé API et Prompt requis.", "error");
          return;
        }

        genBtn.disabled = true;
        loader.style.display = 'block';
        status.style.display = 'none';

        google.script.run
          .withSuccessHandler(function(response) {
            genBtn.disabled = false;
            loader.style.display = 'none';
            if (response.success) {
              document.getElementById('htmlInput').value = response.html;
              showStatus("HTML généré !", "success");
            } else {
              showStatus("Erreur : " + response.error, "error");
            }
          })
          .withFailureHandler(function(err) {
            genBtn.disabled = false;
            loader.style.display = 'none';
            showStatus("Erreur réseau", "error");
          })
          .generateHtmlWithGemini(prompt, apiKey);
      }

      function insertHtml() {
        const html = document.getElementById('htmlInput').value;
        const insertBtn = document.getElementById('insertBtn');
        const loader = document.getElementById('loader');
        const status = document.getElementById('status');
        
        if (!html.trim()) {
          showStatus("Veuillez entrer du code HTML.", "error");
          return;
        }

        insertBtn.disabled = true;
        loader.style.display = 'block';
        status.style.display = 'none';

        google.script.run
          .withSuccessHandler(function(msg) {
            insertBtn.disabled = false;
            loader.style.display = 'none';
            if (msg.includes("Erreur")) {
              showStatus(msg, "error");
            } else {
              showStatus(msg, "Succès !", "success");
            }
          })
          .withFailureHandler(function(err) {
            insertBtn.disabled = false;
            loader.style.display = 'none';
            showStatus("Erreur fatale", "error");
          })
          .insertHtmlIntoDoc(html);
      }

      function showStatus(msg, type) {
        const status = document.getElementById('status');
        const icon = type === 'success' ? 'check_circle' : 'error';
        status.innerHTML = `<span class="material-icons">${icon}</span> ${msg}`;
        status.className = type;
        status.style.display = 'flex';
        setTimeout(() => { status.style.display = 'none'; }, 5000);
      }
    </script>
  </body>
</html>
